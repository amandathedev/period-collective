<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <link rel="icon" href="%PUBLIC_URL%/transparent-heart-drop.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="The Period Collective | Providing Dignity to All" />
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/transparent-heart-drop.svg" />
  <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
  <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
  <title>The Period Collective</title>
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>

  <!-- Netlify Forms detection — hidden static forms required for SPA -->
  <form name="partner-form" netlify hidden>
    <input type="text" name="organization-name" />
    <input type="text" name="contact-name" />
    <input type="email" name="email" />
    <input type="tel" name="phone" />
    <input type="number" name="individuals-served" />
    <input type="text" name="neighborhoods" />
    <input type="number" name="products-per-quarter" />
    <input type="text" name="street-address" />
    <input type="text" name="address-line-2" />
    <input type="text" name="city" />
    <input type="text" name="state" />
    <input type="text" name="zip" />
    <input type="text" name="county" />
    <textarea name="comments"></textarea>
  </form>

  <form name="volunteer-form" netlify hidden>
    <input type="text" name="first-name" />
    <input type="text" name="last-name" />
    <input type="email" name="email" />
    <input type="tel" name="phone" />
    <input type="text" name="location" />
    <input type="text" name="how-to-help" />
    <input type="text" name="contact-me" />
  </form>

  <form name="contact-form" netlify hidden>
    <input type="email" name="email" />
    <input type="text" name="name" />
    <textarea name="message"></textarea>
  </form>
  <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
</body>

</html>
